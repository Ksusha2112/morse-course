server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / { try_files $uri $uri/ /index.html; }
    location /api/ { proxy_pass http://backend:8000/api/; }
    location /stats/ { proxy_pass http://stats-service:8003/api/; }
    location /export/ { proxy_pass http://export-service:8004/api/; }
}